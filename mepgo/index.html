<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한판만 더 — 맞고 로그라이크</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    background: #14241c; color: #e8e4d8; min-height: 100vh;
  }
  #app { display: grid; grid-template-columns: 1fr 280px; gap: 12px; max-width: 1100px; margin: 0 auto; padding: 12px; }
  #board { display: flex; flex-direction: column; gap: 10px; }

  #topbar {
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
    background: #0d1813; border-radius: 10px; padding: 10px 14px; font-size: 14px;
  }
  #topbar b { color: #f5c542; }
  #target-label { color: #ff9e9e; font-weight: bold; }
  #gold-label { color: #f5c542; font-weight: bold; }
  .relic-chip {
    background: #3a2d5a; border: 1px solid #7c6bb0; border-radius: 20px;
    padding: 2px 10px; font-size: 12px; cursor: help;
  }
  #seed-label, #stock-label { color: #7a8a7f; font-size: 12px; margin-left: auto; }

  .zone { background: #0d1813; border-radius: 10px; padding: 10px; }
  .zone-label { font-size: 12px; color: #7a8a7f; margin-bottom: 6px; }
  #floor-zone { background: #1d3a2a; min-height: 130px; }
  .cards { display: flex; flex-wrap: wrap; gap: 6px; min-height: 78px; align-items: flex-start; }

  .card {
    width: 54px; height: 78px; border-radius: 6px; position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 2px solid transparent; flex-shrink: 0; user-select: none;
  }
  .card.mini { width: 34px; height: 50px; }
  .card.mini .c-sym { font-size: 14px; }
  .card.mini .c-name { display: none; }
  .card.mini .c-month { font-size: 9px; }
  .c-month { position: absolute; top: 3px; left: 5px; font-size: 11px; font-weight: bold; opacity: .85; }
  .c-sym { font-size: 22px; font-weight: bold; }
  .c-name { font-size: 10px; opacity: .8; }
  .card.gwang { background: #f5c542; color: #a01010; }
  .card.gwang.bi { background: #4a6fb5; color: #ffe9a8; }
  .card.animal { background: #7bb661; color: #1d3311; }
  .card.ribbon { background: #efe9da; color: #444; }
  .card.pi { background: #5a6258; color: #d8dcd4; }
  .card.pi.ssang { background: #3d4a44; color: #f5c542; border-color: #f5c542; }
  .card.back { background: #802020; color: #d89090; font-size: 20px; }
  .stripe { position: absolute; bottom: 16px; width: 80%; height: 6px; border-radius: 3px; }
  .stripe.hong { background: #d04040; }
  .stripe.cheong { background: #4060c0; }
  .stripe.cho { background: #40a050; }
  .stripe.plain { background: #999; }
  .card.selectable { cursor: pointer; border-color: #f5c542; box-shadow: 0 0 8px #f5c54288; }
  .card.selectable:hover { transform: translateY(-6px); transition: transform .1s; }

  #choose-hint { display: none; color: #f5c542; font-size: 13px; margin-top: 6px; }
  #turn-label { font-size: 14px; color: #a8c0ae; }
  .cap-row { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 4px; }

  #side { display: flex; flex-direction: column; gap: 12px; }
  #score-panel { background: #0d1813; border-radius: 10px; padding: 12px; font-size: 13px; }
  .sc-row { display: flex; justify-content: space-between; padding: 2px 0; }
  .sc-row.mult { color: #f5c542; }
  .sc-row.dim, .dim { color: #7a8a7f; }
  .sc-final { margin-top: 8px; padding-top: 8px; border-top: 1px solid #2a3a30; font-weight: bold; font-size: 15px; }
  .sc-final.ok { color: #7bd88f; }
  .sc-final.bad, .bad { color: #ff7070; }
  #log {
    background: #0d1813; border-radius: 10px; padding: 10px;
    font-size: 12px; color: #9ab0a0; flex: 1; overflow-y: auto;
    min-height: 200px; max-height: 420px; line-height: 1.7;
  }

  #overlay {
    position: fixed; inset: 0; background: #000a; display: none;
    align-items: center; justify-content: center; z-index: 10;
  }
  #overlay-content {
    background: #18271f; border: 1px solid #3a5a45; border-radius: 14px;
    padding: 28px; max-width: 480px; width: 92%; text-align: center;
    max-height: 88vh; overflow-y: auto;
  }
  #overlay-content h2 { margin-bottom: 12px; color: #f5c542; }
  #overlay-content p { margin-bottom: 12px; line-height: 1.6; font-size: 14px; }
  .btn-row { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }
  button {
    background: #2a4a36; color: #e8e4d8; border: 1px solid #4a7a5a;
    border-radius: 8px; padding: 10px 22px; font-size: 15px; cursor: pointer;
    font-family: inherit;
  }
  button:hover:not(:disabled) { background: #3a5f47; }
  button:disabled { opacity: .4; cursor: default; }
  button.good { background: #2a5a3a; border-color: #7bd88f; }
  button.danger { background: #5a2a2a; border-color: #d87b7b; }
  #seed-input {
    background: #0d1813; color: #e8e4d8; border: 1px solid #3a5a45;
    border-radius: 8px; padding: 10px; width: 130px; font-size: 15px;
  }
  .shop-item {
    background: #0d1813; border-radius: 10px; padding: 12px; margin-bottom: 10px;
    text-align: left; font-size: 14px;
  }
  .shop-item .dim { margin: 4px 0 8px; font-size: 12px; }
  .shop-item .cost { color: #f5c542; margin-left: 6px; }
  .shop-item button { padding: 5px 16px; font-size: 13px; }

  @media (max-width: 760px) { #app { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="app">
  <div id="board">
    <div id="topbar">
      <b id="round-label"></b>
      <span id="target-label"></span>
      <span id="gold-label"></span>
      <span id="relic-bar"></span>
      <span id="stock-label"></span>
      <span id="seed-label"></span>
    </div>
    <div class="zone">
      <div class="zone-label"><span id="ai-score">상대 0점</span> · 상대 손패</div>
      <div class="cards" id="ai-hand"></div>
      <div id="ai-captured" style="margin-top:6px"></div>
    </div>
    <div class="zone" id="floor-zone">
      <div class="zone-label">바닥</div>
      <div class="cards" id="floor"></div>
      <div id="choose-hint">→ 가져올 카드를 클릭하세요</div>
    </div>
    <div class="zone">
      <div class="zone-label" id="turn-label"></div>
      <div class="cards" id="hand"></div>
      <div id="my-captured" style="margin-top:6px"></div>
    </div>
  </div>
  <div id="side">
    <div id="score-panel"></div>
    <div id="log"></div>
  </div>
</div>
<div id="overlay"><div id="overlay-content"></div></div>
<script src="game.js"></script>
<script src="ui.js"></script>
</body>
</html>
